<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pacman - Savchenko Aleksey</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: Arial, sans-serif;
    }
    #game-container {
      position: relative;
    }
    canvas {
      border: 2px solid #2121de;
      border-radius: 5px;
    }
    #score {
      color: #fff;
      font-size: 24px;
      margin-bottom: 10px;
      text-align: center;
    }
    #start-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 20px 40px;
      font-size: 24px;
      background: #ffff00;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
    }
    #start-btn:hover {
      background: #ffcc00;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <div id="score">Score: <span id="score-value">0</span></div>
    <canvas id="gameCanvas" width="560" height="620"></canvas>
    <button id="start-btn">START GAME</button>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
